[project]
name = "omnicare-backend"
version = "1.0.0"
description = "OmniCare Financial customer assistant - FastAPI + LangGraph backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: tests that call a real LLM provider (set RUN_LIVE_TESTS=1)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
